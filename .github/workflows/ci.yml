# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Verify environment
        run: |
          echo "Node version:"
          node --version
          echo "npm version:"
          npm --version
          echo "CI workflow is active"
